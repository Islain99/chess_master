name: CI/CD — Chess Platform

# ─────────────────────────────────────────────────────────────────────────────
# Sprint 13 — changements :
#   • backend-ci : `prisma generate` aussi pour ai-engine (sinon tsc échoue)
#   • client-ci (nouveau) : flutter analyze + flutter test + couverture
#   • client-build (nouveau) : build des 6 plateformes (web, android, linux,
#     windows, macos, ios) pour garantir que le client reste compilable
#   • docker-build : ajout de l'image du client Web (Nginx)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── Concurrence : annuler les builds en cours sur la même branche ────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  FLUTTER_CHANNEL: stable
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/chess

jobs:
  # ─── 1. Lint + tests backend ───────────────────────────────────────────────
  backend-ci:
    name: Backend CI (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, ai-engine]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB:       chess
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Les deux services utilisent @prisma/client → client à générer partout.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Push schema to DB
        if: matrix.app == 'api'
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://chess:chess@localhost:5432/chess

      - name: Unit + integration tests
        if: matrix.app == 'api'
        run: npm run test -- --coverage --testTimeout=20000
        env:
          DATABASE_URL: postgresql://chess:chess@localhost:5432/chess
          REDIS_URL:    redis://localhost:6379

      - name: E2E tests
        if: matrix.app == 'api'
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://chess:chess@localhost:5432/chess
          REDIS_URL:    redis://localhost:6379

      - name: Upload coverage
        if: matrix.app == 'api'
        uses: codecov/codecov-action@v4
        with:
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── 2. Analyse + tests du client Flutter ─────────────────────────────────
  client-ci:
    name: Client CI (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Seules les erreurs bloquent ; avertissements et infos restent visibles
      # dans le journal sans casser le build.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit + widget tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: client
          files: apps/client/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── 3. Build multiplateforme du client ───────────────────────────────────
  client-build:
    name: Client build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: client-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            build: web --release
            artifact: apps/client/build/web
          - platform: android
            os: ubuntu-latest
            build: apk --release
            artifact: apps/client/build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            os: ubuntu-latest
            build: linux --release
            artifact: apps/client/build/linux/x64/release/bundle
          - platform: windows
            os: windows-latest
            build: windows --release
            artifact: apps/client/build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            build: macos --release
            artifact: apps/client/build/macos/Build/Products/Release
          - platform: ios
            os: macos-latest
            build: ios --release --no-codesign
            artifact: apps/client/build/ios/iphoneos
    defaults:
      run:
        working-directory: apps/client
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # Génère le dossier plateforme s'il n'est pas encore versionné
      # (no-op sinon) et applique les réglages réseau.
      - name: Bootstrap platform folder
        run: bash tool/bootstrap_platforms.sh ${{ matrix.platform }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: chess-client-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ─── 4. Docker build (sans push sur PR) ───────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [backend-ci, client-ci]
    strategy:
      matrix:
        app: [api, ai-engine, client]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Pour le client, les URL publiques de l'API sont figées à la compilation.
      # Définir les variables de dépôt CLIENT_API_URL / CLIENT_WS_URL ;
      # à défaut, les valeurs localhost du Dockerfile s'appliquent.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context:   apps/${{ matrix.app }}
          push:      ${{ github.ref == 'refs/heads/main' }}
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.app == 'client' && vars.CLIENT_API_URL && format('API_URL={0}', vars.CLIENT_API_URL) || '' }}
            ${{ matrix.app == 'client' && vars.CLIENT_WS_URL && format('WS_URL={0}', vars.CLIENT_WS_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.app }}

  # ─── 5. Déploiement sur staging (main uniquement) ─────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.chess.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> "$GITHUB_ENV"

      - name: Helm upgrade
        run: |
          helm upgrade chess-staging ./infra/helm/chess-platform \
            --namespace chess-staging \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --set secrets.jwtAccessSecret="${{ secrets.JWT_ACCESS_SECRET }}" \
            --set secrets.jwtRefreshSecret="${{ secrets.JWT_REFRESH_SECRET }}" \
            --set secrets.databaseUrl="${{ secrets.DATABASE_URL }}" \
            --set secrets.redisUrl="${{ secrets.REDIS_URL }}" \
            --wait --timeout 5m

  # ─── 6. Déploiement production (tag uniquement) ───────────────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://chess.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> "$GITHUB_ENV"

      - name: Helm upgrade production
        run: |
          helm upgrade chess ./infra/helm/chess-platform \
            --namespace chess \
            --create-namespace \
            --set global.imageTag=${{ github.ref_name }} \
            --set api.replicas=3 \
            --set secrets.jwtAccessSecret="${{ secrets.JWT_ACCESS_SECRET_PROD }}" \
            --set secrets.jwtRefreshSecret="${{ secrets.JWT_REFRESH_SECRET_PROD }}" \
            --set secrets.databaseUrl="${{ secrets.DATABASE_URL_PROD }}" \
            --set secrets.redisUrl="${{ secrets.REDIS_URL_PROD }}" \
            --wait --timeout 10m
