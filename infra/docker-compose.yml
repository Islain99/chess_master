# ─────────────────────────────────────────────────────────────────────────────
# Environnement de développement complet
#   docker compose -f infra/docker-compose.yml up --build
#
# Sprint 13 : ajout du service « client » (Flutter Web servi par Nginx)
#   → http://localhost:8080
#
# Sprint 19 :
#   • JWT_ACCESS_SECRET OBLIGATOIRE pour l'API (elle refuse désormais de
#     démarrer en production sans secret solide) — à mettre dans infra/.env :
#       JWT_ACCESS_SECRET=<openssl rand -hex 32>
#   • service « migrate » : crée / met à jour les tables (prisma db push)
#     avant le démarrage de l'API
#   • Postgres et Redis publiés sur 127.0.0.1 uniquement (plus sur le réseau)
#   • client servi par Nginx non-root sur le port 8080 du conteneur
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ../apps/ai-engine
    environment:
      PORT: 3001
      STOCKFISH_PATH: /usr/bin/stockfish
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Sprint 19 : schéma de base appliqué avant l'API (puis s'arrête) ──────
  migrate:
    image: chess-api:local
    build:
      context: ../apps/api
    command: ["npm", "run", "db:push"]
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: chess-api:local
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
      # Vide → l'API refuse de démarrer et l'indique dans ses logs (sprint 19)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:3001
      PORT: 3000
      CORS_ORIGIN: "*"
      # Sprint 15 — OAuth : renseigner dans infra/.env (vide = désactivé)
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      APPLE_ANDROID_PACKAGE: ${APPLE_ANDROID_PACKAGE:-com.islain99.chess_client}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Sprint 16 — notifications push FCM (vide = désactivé)
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Sprint 13 : client Web ────────────────────────────────────────────────
  # Le navigateur appelle l'API depuis la machine hôte → URL en localhost:3000
  # (et non api:3000, qui n'existe que dans le réseau Docker).
  client:
    build:
      context: ../apps/client
      args:
        API_URL: http://localhost:3000/api/v1
        WS_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres_data:
