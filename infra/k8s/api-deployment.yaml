apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-api
  namespace: chess
  labels:
    app: chess-api
    version: "1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: chess-api }
  template:
    metadata:
      labels: { app: chess-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "3000"
    spec:
      containers:
        - name: api
          image: chess-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:  { name: chess-api-secret  }
            - configMapRef: { name: chess-api-config }
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 250m,  memory: 256Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: chess-api
  namespace: chess
spec:
  selector: { app: chess-api }
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-api-config
  namespace: chess
data:
  NODE_ENV:    production
  PORT:        "3000"
  CORS_ORIGIN: "https://chess.example.com"
  AI_ENGINE_URL: "http://chess-ai-engine:3001"
---
# HorizontalPodAutoscaler — scale automatiquement selon CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chess-api-hpa
  namespace: chess
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chess-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
