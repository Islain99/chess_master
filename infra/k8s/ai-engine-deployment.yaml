apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-ai-engine
  namespace: chess
spec:
  replicas: 2
  selector:
    matchLabels: { app: chess-ai-engine }
  template:
    metadata:
      labels: { app: chess-ai-engine }
    spec:
      containers:
        - name: ai-engine
          image: chess-ai-engine:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:  { name: chess-api-secret }
            - configMapRef: { name: chess-ai-engine-config }
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 500m,  memory: 512Mi }
            limits:   { cpu: 2000m, memory: 1Gi  }
---
apiVersion: v1
kind: Service
metadata:
  name: chess-ai-engine
  namespace: chess
spec:
  selector: { app: chess-ai-engine }
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-ai-engine-config
  namespace: chess
data:
  PORT:             "3001"
  STOCKFISH_PATH:   "/usr/bin/stockfish"
