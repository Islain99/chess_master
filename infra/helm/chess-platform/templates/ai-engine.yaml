{{- /* ───────────────────────────────────────────────────────────────────────
     Sprint 19 — Moteur IA (Stockfish) : Deployment, Service, HPA, PDB
     Avant : absent du chart (l'API appelait un service inexistant).
     Service interne uniquement (ClusterIP) : jamais exposé par l'ingress.
     ─────────────────────────────────────────────────────────────────────── */}}
{{- if .Values.aiEngine.enabled }}
{{- $ctx := dict "root" . "name" "ai-engine" }}
{{- $secret := include "chess.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.aiEngine.autoscaling.enabled }}
  replicas: {{ .Values.aiEngine.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "chess.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chess.labels" $ctx | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.aiEngine.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "chess.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Une analyse en cours (BullMQ) est reprise par un autre pod si celui-ci
      # s'arrête ; on lui laisse tout de même le temps de finir un coup.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chess.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: ai-engine
          image: {{ include "chess.image" (dict "root" . "image" .Values.aiEngine.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3001" }
            - { name: STOCKFISH_PATH, value: {{ .Values.aiEngine.stockfishPath | quote }} }
            {{- range list "DATABASE_URL" "REDIS_URL" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ . }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            {{- include "chess.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.aiEngine.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.aiEngine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiEngine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiEngine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "chess.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: http
{{- if .Values.aiEngine.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chess.component" $ctx }}
  minReplicas: {{ .Values.aiEngine.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.aiEngine.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.aiEngine.autoscaling.targetCPU }}
{{- end }}
{{- if or .Values.aiEngine.autoscaling.enabled (gt (int .Values.aiEngine.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "chess.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
