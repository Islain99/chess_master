{{- /* ───────────────────────────────────────────────────────────────────────
     Sprint 19 — Cloisonnement réseau
     Postgres : joignable par l'API, l'IA et le Job de migration uniquement.
     Redis    : joignable par l'API et l'IA uniquement.
     IA       : joignable par l'API (et Prometheus) uniquement.
     (Requiert un CNI qui applique les NetworkPolicies : Calico, Cilium…)
     ─────────────────────────────────────────────────────────────────────── */}}
{{- if .Values.networkPolicy.enabled }}
{{- $root := . }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chess.component" (dict "root" . "name" "postgres") }}
  labels:
    {{- include "chess.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chess.selectorLabels" (dict "root" . "name" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "chess.np.from" (dict "root" $root "components" (list "api" "ai-engine" "migrate")) | nindent 8 }}
      ports:
        - { port: 5432, protocol: TCP }
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chess.component" (dict "root" . "name" "redis") }}
  labels:
    {{- include "chess.labels" (dict "root" . "name" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chess.selectorLabels" (dict "root" . "name" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "chess.np.from" (dict "root" $root "components" (list "api" "ai-engine")) | nindent 8 }}
      ports:
        - { port: 6379, protocol: TCP }
---
{{- end }}
{{- if .Values.aiEngine.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chess.component" (dict "root" . "name" "ai-engine") }}
  labels:
    {{- include "chess.labels" (dict "root" . "name" "ai-engine") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chess.selectorLabels" (dict "root" . "name" "ai-engine") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "chess.np.from" (dict "root" $root "components" (list "api")) | nindent 8 }}
        # Prometheus (autre namespace) : collecte de /metrics
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { port: 3001, protocol: TCP }
{{- end }}
{{- end }}
