{{- /* ───────────────────────────────────────────────────────────────────────
     Sprint 19 — Secret applicatif
     Avant : référencé par l'API mais jamais créé (pods en CreateContainerConfigError).
     ─────────────────────────────────────────────────────────────────────── */}}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- if and $s.jwtAccessSecret (or (lt (len $s.jwtAccessSecret) 32) (has $s.jwtAccessSecret (list "CHANGE_ME_IN_PROD" "change-me"))) }}
{{- fail "secrets.jwtAccessSecret : 32 caractères minimum (ou vide pour le générer)." }}
{{- end }}
{{- if and (not .Values.postgresql.enabled) (not $s.databaseUrl) }}
{{- fail "postgresql.enabled=false : renseigner secrets.databaseUrl." }}
{{- end }}
{{- if and (not .Values.redis.enabled) (not $s.redisUrl) }}
{{- fail "redis.enabled=false : renseigner secrets.redisUrl." }}
{{- end }}
{{- $jwt := include "chess.persistentSecret" (dict "root" . "key" "JWT_ACCESS_SECRET" "value" $s.jwtAccessSecret "length" 64) }}
{{- $pgPass := include "chess.persistentSecret" (dict "root" . "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.auth.password "length" 32) }}
{{- $redisPass := include "chess.persistentSecret" (dict "root" . "key" "REDIS_PASSWORD" "value" .Values.redis.auth.password "length" 32) }}
{{- $pg := .Values.postgresql.auth }}
{{- $dbUrl := $s.databaseUrl | default (printf "postgresql://%s:%s@%s:5432/%s" $pg.username (urlquery $pgPass) (include "chess.component" (dict "root" . "name" "postgres")) $pg.database) }}
{{- $redisUrl := $s.redisUrl | default (printf "redis://:%s@%s:6379" (urlquery $redisPass) (include "chess.component" (dict "root" . "name" "redis"))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chess.secretName" . }}
  labels:
    {{- include "chess.labels" (dict "root" . "name" "secrets") | nindent 4 }}
  annotations:
    # Conservé à la désinstallation : le volume Postgres, lui aussi conservé,
    # est initialisé avec ce mot de passe.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_ACCESS_SECRET: {{ $jwt | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | b64enc | quote }}
  REDIS_PASSWORD: {{ $redisPass | b64enc | quote }}
  DATABASE_URL: {{ $dbUrl | b64enc | quote }}
  REDIS_URL: {{ $redisUrl | b64enc | quote }}
  {{- with $s.jwtRefreshSecret }}
  JWT_REFRESH_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.facebookAppSecret }}
  FACEBOOK_APP_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.fcmServiceAccount }}
  FCM_SERVICE_ACCOUNT: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
