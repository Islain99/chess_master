{{- /* ───────────────────────────────────────────────────────────────────────
     API NestJS — Deployment, Service, HPA, PodDisruptionBudget
     Sprint 19 : secret réellement créé, sonde readiness sur la base,
     utilisateur non-root + système de fichiers en lecture seule, arrêt
     progressif (preStop) pour ne pas couper les parties en cours.
     ─────────────────────────────────────────────────────────────────────── */}}
{{- if .Values.api.enabled }}
{{- $ctx := dict "root" . "name" "api" }}
{{- $secret := include "chess.secretName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "chess.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chess.labels" $ctx | nindent 8 }}
      annotations:
        # Redémarre les pods quand le Secret change (rotation du JWT, etc.)
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "chess.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Laisse le temps aux sockets de se fermer proprement (enableShutdownHooks)
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "chess.selectorLabels" $ctx | nindent 14 }}
      containers:
        - name: api
          image: {{ include "chess.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            {{- $publicUrl := ternary (printf "https://%s" .Values.ingress.host) "" .Values.ingress.enabled }}
            {{- range $k, $v := .Values.api.env }}
            {{- /* CORS_ORIGIN / PUBLIC_WEB_URL vides → https://<ingress.host> */}}
            {{- if and (not $v) (has $k (list "CORS_ORIGIN" "PUBLIC_WEB_URL")) }}
            {{- $v = $publicUrl }}
            {{- end }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: AI_ENGINE_URL
              value: "http://{{ include "chess.component" (dict "root" . "name" "ai-engine") }}:3001"
            {{- range list "DATABASE_URL" "REDIS_URL" "JWT_ACCESS_SECRET" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ . }} }
            {{- end }}
            # Facultatifs : fonctionnalité désactivée si la clé est absente
            {{- range list "JWT_REFRESH_SECRET" "FACEBOOK_APP_SECRET" "FCM_SERVICE_ACCOUNT" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ . }}, optional: true }
            {{- end }}
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # L'ingress retire le pod de ses cibles avant l'arrêt du processus
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            {{- include "chess.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "chess.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chess.component" $ctx }}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPU }}
{{- end }}
{{- if or .Values.api.autoscaling.enabled (gt (int .Values.api.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chess.component" $ctx }}
  labels:
    {{- include "chess.labels" $ctx | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "chess.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
