# ─── Valeurs par défaut — surcharger par environnement ───────────────────────

global:
  imageRegistry:  ""
  imageTag:       "latest"
  imagePullPolicy: Always
  namespace:      chess

api:
  enabled:  true
  replicas: 2
  image:
    repository: chess-api
    tag:        ""  # hérite de global.imageTag
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 512Mi }
  autoscaling:
    enabled:     true
    minReplicas: 2
    maxReplicas: 10
    targetCPU:   70
  env:
    NODE_ENV:    production
    PORT:        "3000"
    CORS_ORIGIN: "https://chess.example.com"
    # ─── OAuth (sprint 15) — identifiants PUBLICS, vide = fournisseur désactivé
    GOOGLE_CLIENT_IDS:     ""   # client IDs Web, iOS, macOS séparés par des virgules
    APPLE_CLIENT_IDS:      ""   # bundle ID iOS/macOS + Services ID (Android/Web)
    APPLE_ANDROID_PACKAGE: "com.islain99.chess_client"
    FACEBOOK_APP_ID:       ""
    # ─── Push (sprint 16) : lien ouvert au clic sur une notification Web
    PUBLIC_WEB_URL:        "https://chess.example.com"

aiEngine:
  enabled:  true
  replicas: 2
  image:
    repository: chess-ai-engine
    tag:        ""
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 2,    memory: 1Gi  }
  stockfishPath: /usr/bin/stockfish

postgresql:
  enabled:  true
  auth:
    username: chess
    database: chess
    existingSecret: postgres-secret
  primary:
    persistence:
      size: 20Gi

redis:
  enabled:  true
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      limits: { memory: 256Mi }

ingress:
  enabled:   true
  className: nginx
  host:      chess.example.com
  tls:
    enabled:    true
    secretName: chess-tls
    certIssuer: letsencrypt-prod

monitoring:
  enabled: false  # activer pour Prometheus + Grafana

secrets:
  # À fournir via --set ou un secret manager en production
  jwtAccessSecret:  "CHANGE_ME_IN_PROD"
  jwtRefreshSecret: "CHANGE_ME_IN_PROD"
  databaseUrl:      "postgresql://chess:chess@postgres:5432/chess"
  redisUrl:         "redis://redis:6379"
  facebookAppSecret: ""   # sprint 15 — App Secret Meta (--set secrets.facebookAppSecret=…)
  fcmServiceAccount: ""   # sprint 16 — JSON du compte de service Firebase, en base64
