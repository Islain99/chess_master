name: chess_client
description: Jeu d'échecs multiplateforme — Flutter
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"  # 3.6 : séparateurs de chiffres (10_000) utilisés dans ClockWidget

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Réseau
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # Stockage sécurisé des tokens
  shared_preferences: ^2.2.3

  # Connexion OAuth (sprint 15)
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0      # bouton officiel Google sur le Web
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.3.2
  crypto: ^3.0.6                  # SHA-256 du nonce Apple

  # Notifications push (sprint 16)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

  # UI
  google_fonts: ^6.2.1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
