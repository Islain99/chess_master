# ─────────────────────────────────────────────────────────────────────────────
# Sprint 13 — Nginx pour le client Web Flutter (application monopage)
# ─────────────────────────────────────────────────────────────────────────────
server {
  # Sprint 19 : 8080 (image nginx-unprivileged, non-root)
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── Compression ───────────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             application/wasm image/svg+xml font/ttf font/otf;

  # ─── En-têtes de sécurité ──────────────────────────────────────────────────
  # NB : un add_header dans un bloc location remplace ceux du serveur ; les
  # blocs de cache ci-dessous répètent donc l'en-tête nosniff.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ─── Sonde de santé (Docker / Kubernetes) ──────────────────────────────────
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ─── Jamais en cache : point d'entrée et service worker ────────────────────
  # Sinon les navigateurs gardent l'ancienne version après un déploiement.
  location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ─── Ressources statiques : cache long ─────────────────────────────────────
  location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|ttf|otf|woff2?|json)$ {
    expires 7d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # ─── Routage côté client : toute URL inconnue renvoie index.html ───────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
